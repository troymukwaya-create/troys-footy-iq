# Morning Ledger — yesterday's receipts to the social channels.
# Cron is UTC and GitHub delays it a few minutes, so 06:50 lands ~07:00
# (Troy's 8 a.m.). Manual runs via the Actions tab → Run workflow.
name: social-ledger
on:
  schedule:
    - cron: '50 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate + host only, skip posting'
        type: boolean
        default: false

permissions:
  contents: write   # pushes the morning's cards to the social-assets branch (public URLs for Instagram)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: install renderer
        run: npm i --no-save puppeteer-core@latest
        working-directory: scripts/social
      - name: generate cards + captions
        run: node generate.mjs ledger
        working-directory: scripts/social
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: host cards publicly (social-assets branch → raw URLs for Instagram)
        id: host
        run: |
          if ls scripts/social/out/*.png >/dev/null 2>&1; then
            DATE=$(date -u +%F)
            git config user.name "oddyessa-bot"
            git config user.email "bot@oddyessa.com"
            git fetch origin social-assets:social-assets || git branch social-assets
            git worktree add /tmp/assets social-assets
            mkdir -p "/tmp/assets/$DATE"
            cp scripts/social/out/*.png "/tmp/assets/$DATE/"
            cd /tmp/assets && git add . && git commit -m "social assets $DATE" && git push origin social-assets
            echo "IMAGE_BASE_URL=https://raw.githubusercontent.com/${{ github.repository }}/social-assets/$DATE" >> "$GITHUB_ENV"
          else
            echo "no cards generated — nothing to host"
          fi
      - name: publish
        if: ${{ inputs.dry_run != true }}
        run: node publish.mjs ledger
        working-directory: scripts/social
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: keep the morning's pack as an artifact (Troy can download for LinkedIn/Reddit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-pack-${{ github.run_id }}
          path: scripts/social/out/
          retention-days: 7
