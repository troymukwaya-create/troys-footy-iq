version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: football
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
volumes:
  pgdata:
