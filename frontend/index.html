<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Match Safari's top/bottom chrome to the black brand chrome so the site
         reads edge-to-edge on iOS (no white bars) and the status bar / Dynamic
         Island sit on dark brand color. -->
    <meta name="theme-color" content="#0B0B0D" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Oddyessa — AI-powered sports prediction: real-time match intelligence, probabilities, value edges, and an honestly published track record." />
    <title>Oddyessa — read the game</title>

    <!-- Canonical + Google Search Console -->
    <link rel="canonical" href="https://oddyessa.com/" />
    <meta name="google-site-verification" content="REPLACE_ME_GSC_TOKEN" />

    <!-- Open Graph — link previews for WhatsApp / iMessage / Facebook / LinkedIn. -->
    <!-- Nearly all current traffic is shared links, so these tags drive click-through. -->
    <!-- TODO(Troy): add frontend/public/og-image.png (1200x630, <1MB) — without it previews show no image. -->
    <meta property="og:title" content="Oddyessa — read the game" />
    <meta property="og:description" content="AI-powered football prediction with an honestly published track record: real-time match intelligence, probabilities, and value edges vs the bookmakers." />
    <meta property="og:image" content="https://oddyessa.com/og-image.png" />
    <meta property="og:url" content="https://oddyessa.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oddyessa" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oddyessa — read the game" />
    <meta name="twitter:description" content="AI-powered football prediction with an honestly published track record: real-time match intelligence, probabilities, and value edges vs the bookmakers." />
    <meta name="twitter:image" content="https://oddyessa.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Brand type: Archivo (variable, width axis for the expanded headline
         voice) + IBM Plex Mono for all numbers. One face, web + marketing.
         (Plex Sans/Serif + unused Material Symbols dropped — lighter, too.) -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- Instant branded splash — the animated orbit reveal, pure CSS so it
           plays before any JS loads and the screen is never blank. -->
      <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070708;gap:8px;font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
        <svg width="150" height="100" viewBox="0 0 400 200" style="overflow:visible">
          <path id="bootRing" pathLength="100" d="M 211.9 55.6 A 46 46 0 1 0 244.4 88.1" fill="none" stroke="#F7F4EE" stroke-width="9" stroke-linecap="round" style="stroke-dasharray:100;stroke-dashoffset:100;animation:bootDraw 1s cubic-bezier(.65,0,.35,1) .42s forwards"/>
          <circle cx="232.5" cy="67.5" r="11" fill="#C0392B" style="transform-box:fill-box;transform-origin:center;opacity:0;animation:bootPop .5s cubic-bezier(.34,1.7,.5,1) forwards"/>
        </svg>
        <div id="bootWord" style="font-size:21px;font-weight:800;font-stretch:125%;font-variation-settings:'wdth' 125,'wght' 800;letter-spacing:-0.01em"></div>
        <svg width="26" height="26" viewBox="0 0 100 100" fill="none" style="margin-top:12px;animation:bootspin .9s linear infinite">
          <path d="M 57.25 22.95 A 28 28 0 1 0 77.05 42.75" fill="none" stroke="#F7F4EE" stroke-width="6.5" stroke-linecap="round"/>
          <circle cx="69.8" cy="30.2" r="8" fill="#C0392B"/>
        </svg>
        <noscript><div style="color:#cfd2da;font-size:13px">Please enable JavaScript to use Oddyessa.</div></noscript>
      </div>
      <script>
        (function(){
          var w=document.getElementById('bootWord');
          if(!w)return;
          var letters='Oddyessa'.split('');
          letters.forEach(function(ch,i){
            var s=document.createElement('span');
            s.textContent=ch;
            s.style.cssText='display:inline-block;opacity:0;transform:translateY(20px) scale(.5);color:'+(i<3?'#C0392B':'#cfd2da')+';animation:bootLetter .6s cubic-bezier(.5,1.7,.45,1) forwards;animation-delay:'+(1.28+i*0.08)+'s';';
            w.appendChild(s);
          });
        })();
      </script>
    </div>
    <style>
      @keyframes bootspin{to{transform:rotate(360deg)}}
      @keyframes bootPop{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.45)}100%{opacity:1;transform:scale(1)}}
      @keyframes bootDraw{to{stroke-dashoffset:0}}
      @keyframes bootLetter{0%{opacity:0;transform:translateY(20px) scale(.5)}55%{opacity:1;transform:translateY(-7px) scale(1.09)}100%{opacity:1;transform:translateY(0) scale(1)}}
      @media (prefers-reduced-motion: reduce){#boot *{animation-duration:.01ms!important}#boot circle{opacity:1!important}#bootRing{stroke-dashoffset:0!important}}
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
