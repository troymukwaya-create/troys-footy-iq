<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Oddyessa — AI-powered sports prediction: real-time match intelligence, probabilities, value edges, and an honestly published track record." />
    <title>Oddyessa — read the game</title>

    <!-- Canonical + Google Search Console -->
    <link rel="canonical" href="https://oddyessa.com/" />
    <meta name="google-site-verification" content="REPLACE_ME_GSC_TOKEN" />

    <!-- Open Graph — link previews for WhatsApp / iMessage / Facebook / LinkedIn. -->
    <!-- Nearly all current traffic is shared links, so these tags drive click-through. -->
    <!-- TODO(Troy): add frontend/public/og-image.png (1200x630, <1MB) — without it previews show no image. -->
    <meta property="og:title" content="Oddyessa — read the game" />
    <meta property="og:description" content="AI-powered football prediction with an honestly published track record: real-time match intelligence, probabilities, and value edges vs the bookmakers." />
    <meta property="og:image" content="https://oddyessa.com/og-image.png" />
    <meta property="og:url" content="https://oddyessa.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oddyessa" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oddyessa — read the game" />
    <meta name="twitter:description" content="AI-powered football prediction with an honestly published track record: real-time match intelligence, probabilities, and value edges vs the bookmakers." />
    <meta name="twitter:image" content="https://oddyessa.com/og-image.png" />

    <!-- Warm up the API origin so the first data call is faster on mobile -->
    <link rel="preconnect" href="https://troys-footy-iq-api.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://troys-footy-iq-api.onrender.com" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- Instant branded splash — shown before any JS loads so the screen is never blank -->
      <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070708;gap:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
        <div style="width:46px;height:46px;border-radius:12px;background:rgba(168,52,74,0.14);border:1px solid rgba(168,52,74,0.32);display:flex;align-items:center;justify-content:center">
          <span style="font-size:22px;font-weight:800;color:#A8344A">O</span>
        </div>
        <div style="font-size:17px;font-weight:700"><span style="color:#A8344A">Odd</span><span style="color:#cfd2da">yessa</span></div>
        <div style="width:24px;height:24px;border:2.5px solid rgba(255,255,255,0.12);border-top-color:#A8344A;border-radius:50%;animation:bootspin .8s linear infinite"></div>
        <noscript><div style="color:#cfd2da;font-size:13px">Please enable JavaScript to use Oddyessa.</div></noscript>
      </div>
    </div>
    <style>@keyframes bootspin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
