<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ─── Morning Ledger card system (parametric) ───────────────────────
     The Day-1 cards, turned into a template the generator fills with
     live data each morning. Brand canon: REAL flag bleeds (FlagBleed
     recipe), Archivo Expanded display, Plex Mono numbers, dark chrome. */
  :root{
    --chrome:#0B0B0D; --page:#1B1E25; --card:#14161B;
    --ox:#A8344A; --green:#22C55E; --gold:#EAB308; --red:#EF4444;
    --t92:rgba(255,255,255,.92); --t60:rgba(255,255,255,.60); --t36:rgba(255,255,255,.36);
    --rule:rgba(255,255,255,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#333;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .card{position:relative;overflow:hidden;background:var(--chrome);margin:20px auto;}
  .wordmark{font-stretch:116%;font-weight:800;font-size:28px;color:var(--t92);}
  .wordmark b{color:var(--ox);}

  /* flag bleed — site recipe */
  .bleedwrap{isolation:isolate;}
  .bleed{position:absolute;inset:0;z-index:-1;overflow:hidden;border-radius:inherit;}
  .paper .bleed{
    -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 30%,rgba(0,0,0,.35) 55%,transparent 80%);
    mask-image:linear-gradient(180deg,#000 0%,#000 30%,rgba(0,0,0,.35) 55%,transparent 80%);}
  .bleed .fl,.bleed .fr{position:absolute;top:0;bottom:0;width:68%;background-size:cover;background-position:center;
    filter:blur(4px) saturate(1.05);transform:scale(1.15);}
  .bleed .fl{left:-4%;
    -webkit-mask-image:linear-gradient(99deg,#000 0%,rgba(0,0,0,.9) 28%,rgba(0,0,0,.35) 62%,transparent 96%);
    mask-image:linear-gradient(99deg,#000 0%,rgba(0,0,0,.9) 28%,rgba(0,0,0,.35) 62%,transparent 96%);}
  .bleed .fr{right:-4%;
    -webkit-mask-image:linear-gradient(279deg,#000 0%,rgba(0,0,0,.9) 28%,rgba(0,0,0,.35) 62%,transparent 96%);
    mask-image:linear-gradient(279deg,#000 0%,rgba(0,0,0,.9) 28%,rgba(0,0,0,.35) 62%,transparent 96%);}
  .bleed .veil{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(11,11,13,.28) 0%,rgba(11,11,13,.46) 55%,rgba(11,11,13,.68) 100%);}
  .lrow .veil{background:linear-gradient(180deg,rgba(11,11,13,.5) 0%,rgba(11,11,13,.62) 55%,rgba(11,11,13,.75) 100%) !important;}

  /* ═══ MORNING LEDGER — Seam family ═══════════════════════════════════
     Re-skinned to match the "The Call · Seam" pre-match / verdict cards:
     dark chrome, crisp flag-SEAM tiles (a miniature of the hero card's
     flag seam — no more blurred bleed), verdict chips, and oxblood
     state accents, laid out as the day's results list. */
  #ledger,#ledger-ig{--surface:#0B0B0D;--cream:#F7F4EE;--steel:#8A94A6;
    --t1:rgba(255,255,255,.92);--t2:rgba(255,255,255,.58);--t3:rgba(255,255,255,.36);
    --b2:rgba(255,255,255,.10);background:var(--surface);}
  /* crisp flag-seam tile — the hero seam, miniaturised */
  .fpair{position:relative;border-radius:9px;overflow:hidden;flex-shrink:0;border:1px solid rgba(255,255,255,.14);}
  .fpair .fc{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(1.05);}
  .fpair .h{clip-path:polygon(0 0,60% 0,40% 100%,0 100%);}
  .fpair .a{clip-path:polygon(60% 0,100% 0,100% 100%,40% 100%);}
  .fpair .ln{position:absolute;inset:0;}
  /* verdict chip — ✓ called · ≈ inside our range · ± against the read · ✗ miss */
  .tick{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
  .tick.hit{background:rgba(34,197,94,.12);border:2px solid var(--green);color:var(--green);}
  .tick.miss{background:rgba(239,68,68,.12);border:2px solid var(--red);color:var(--red);}
  .tick.range{background:rgba(138,148,166,.14);border:2px solid var(--steel);color:#AAB2C0;}
  .tick.amber{background:rgba(234,179,8,.12);border:2px solid var(--gold);color:var(--gold);}
  /* row = a mini seam band; --rc is the verdict-state accent */
  .lrow{display:flex;align-items:center;gap:26px;background:rgba(20,22,27,.85);
    border:1px solid var(--b2);border-left:5px solid var(--rc,var(--ox));border-radius:14px;}
  .lrow .mid{flex:1;min-width:0;}
  .lscore{display:flex;align-items:baseline;gap:13px;line-height:1;white-space:nowrap;}
  .lscore .c{font-weight:800;color:var(--cream);letter-spacing:-.01em;}
  .lscore .s{font-family:'IBM Plex Mono',monospace;font-weight:700;color:#fff;letter-spacing:-.01em;}
  .lrow .call{color:var(--t2);}
  .lrow .call b{color:var(--t1);font-weight:600;}
  .lrow .brier{font-family:'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--t3);text-align:right;flex-shrink:0;text-transform:uppercase;}
  .lrow .brier b{display:block;letter-spacing:-.01em;color:var(--t1);font-weight:700;}
  /* honest Brier scale */
  .track-wrap{margin-top:auto;}
  .track-labels{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--t3);}
  .track{position:relative;height:10px;border-radius:5px;
    background:linear-gradient(90deg,rgba(34,197,94,.55),rgba(234,179,8,.4) 60%,rgba(239,68,68,.45));}
  .marker{position:absolute;top:50%;transform:translate(-50%,-50%);}
  .marker .dot{width:24px;height:24px;border-radius:50%;background:var(--ox);border:5px solid #0B0B0D;box-shadow:0 0 0 2px var(--ox),0 6px 18px rgba(168,52,74,.5);}
  .marker .tag{position:absolute;top:34px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--t1);}
  .marker .tag span{color:var(--ox);font-weight:700;}

  /* ── X 1600×900 ── */
  #ledger{width:1600px;height:900px;padding:60px 70px;display:flex;flex-direction:column;}
  #ledger .top{display:flex;justify-content:space-between;align-items:center;}
  #ledger .kicker{font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:.16em;color:var(--t2);text-transform:uppercase;}
  #ledger h1{font-weight:800;font-size:70px;line-height:1.05;color:var(--t1);margin-top:28px;letter-spacing:-.01em;}
  #ledger h1 .ox{color:var(--ox);}
  #ledger .ledgerrows{margin-top:32px;display:flex;flex-direction:column;gap:13px;}
  #ledger .lrow{gap:26px;padding:17px 30px;}
  #ledger .fpair{width:104px;height:58px;}
  #ledger .tick{width:42px;height:42px;font-size:22px;}
  #ledger .lscore .c{font-size:34px;} #ledger .lscore .s{font-size:32px;}
  #ledger .lrow .call{font-size:19px;margin-top:9px;}
  #ledger .lrow .brier{font-size:14px;}
  #ledger .lrow .brier b{font-size:30px;margin-top:5px;}
  #ledger .track-wrap{padding-top:34px;}
  #ledger .track-labels{font-size:16px;margin-bottom:14px;}
  #ledger .marker .tag{font-size:19px;}
  #ledger .foot{margin-top:60px;display:flex;justify-content:space-between;align-items:flex-end;}
  #ledger .foot .note{font-size:18px;color:var(--t3);}
  #ledger .foot .url{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--t2);}

  /* ── IG 1080×1350 (4:5 native) ── */
  #ledger-ig{width:1080px;height:1350px;padding:62px 58px;display:flex;flex-direction:column;}
  #ledger-ig .top{display:flex;justify-content:space-between;align-items:center;}
  #ledger-ig .kicker{font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:.16em;color:var(--t2);text-transform:uppercase;}
  #ledger-ig h1{font-weight:800;font-size:74px;line-height:1.06;color:var(--t1);margin-top:30px;letter-spacing:-.01em;}
  #ledger-ig h1 .ox{color:var(--ox);}
  #ledger-ig .igrows{margin-top:40px;display:flex;flex-direction:column;gap:16px;}
  #ledger-ig .lrow{gap:24px;padding:22px 28px;border-radius:16px;}
  #ledger-ig .fpair{width:108px;height:62px;}
  #ledger-ig .tick{width:44px;height:44px;font-size:23px;}
  #ledger-ig .lscore .c{font-size:36px;} #ledger-ig .lscore .s{font-size:34px;}
  #ledger-ig .lrow .call{font-size:21px;margin-top:10px;}
  #ledger-ig .lrow .brier{font-size:14px;}
  #ledger-ig .lrow .brier b{font-size:30px;margin-top:5px;}
  #ledger-ig .track-wrap{padding-top:44px;}
  #ledger-ig .track-labels{font-size:17px;margin-bottom:14px;}
  #ledger-ig .marker .tag{font-size:19px;}
  #ledger-ig .foot{margin-top:28px;display:flex;flex-direction:column;gap:9px;align-items:center;text-align:center;}
  #ledger-ig .foot .note{font-size:19px;color:var(--t3);}
  #ledger-ig .foot .url{font-family:'IBM Plex Mono',monospace;font-size:21px;color:var(--t2);}

  /* ═══ RECEIPT 1080×1350 ═══ */
  #receipt-stage{width:1080px;height:1350px;background:var(--page);display:flex;align-items:center;justify-content:center;}
  .paper{position:relative;width:880px;background:#14161B;border:1px solid rgba(255,255,255,.10);
    border-radius:6px;padding:54px 64px 44px;box-shadow:0 40px 90px rgba(0,0,0,.55);}
  .paper:before,.paper:after{content:'';position:absolute;left:0;right:0;height:14px;
    background-image:radial-gradient(circle at 7px 7px, var(--page) 6px, transparent 6.5px);
    background-size:28px 14px;background-position:center;z-index:2;}
  .paper:before{top:-1px;} .paper:after{bottom:-1px;transform:rotate(180deg);}
  .r-head{position:relative;text-align:center;padding-bottom:26px;border-bottom:1px dashed rgba(255,255,255,.18);}
  .r-kicker{font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:.2em;color:rgba(255,255,255,.5);margin-top:16px;}
  .r-match{font-stretch:116%;font-weight:800;font-size:42px;color:var(--t92);margin-top:10px;line-height:1.12;}
  .r-ft{font-family:'IBM Plex Mono',monospace;font-size:74px;font-weight:700;color:var(--t92);margin-top:6px;}
  .r-meta{font-family:'IBM Plex Mono',monospace;font-size:19px;color:rgba(255,255,255,.72);margin-top:10px;}
  .r-items{position:relative;padding:24px 0;border-bottom:1px dashed rgba(255,255,255,.18);}
  .item{display:flex;align-items:baseline;gap:14px;padding:10px 0;font-family:'IBM Plex Mono',monospace;font-size:24px;}
  .item .lab{color:rgba(255,255,255,.78);}
  .item .dots{flex:1;border-bottom:2px dotted rgba(255,255,255,.14);transform:translateY(-5px);}
  .item .val{color:var(--t92);font-weight:600;}
  .item .res{width:34px;text-align:center;font-weight:700;}
  .hit{color:var(--green);} .miss{color:var(--red);} .range{color:#AAB2C0;} .amber{color:var(--gold);}
  .item .sub{color:rgba(255,255,255,.5);font-size:19px;}
  .r-total{position:relative;display:flex;align-items:center;justify-content:space-between;padding:28px 0 6px;}
  .r-total .lab{font-family:'IBM Plex Mono',monospace;letter-spacing:.22em;font-size:18px;color:var(--t60);}
  .r-total .lab small{display:block;letter-spacing:.05em;font-size:14px;color:var(--t36);margin-top:6px;}
  .brier-num{font-family:'IBM Plex Mono',monospace;font-size:80px;font-weight:700;}
  .brier-num .lead{color:#7A8694;} .brier-num .digits{color:var(--ox);}
  .r-foot{position:relative;margin-top:24px;padding-top:20px;border-top:1px dashed rgba(255,255,255,.18);display:flex;justify-content:space-between;align-items:center;}
  .r-foot .url{font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--t60);}
  .r-foot .tag{font-size:18px;color:var(--t36);font-style:italic;}
  .barcode{height:32px;width:230px;opacity:.55;
    background:repeating-linear-gradient(90deg,var(--t92) 0 2px,transparent 2px 5px,var(--t92) 5px 9px,transparent 9px 12px,var(--t92) 12px 13px,transparent 13px 17px);}
  .stamp{position:absolute;top:58px;right:30px;transform:rotate(8deg);border:4px solid var(--green);color:var(--green);
    border-radius:10px;padding:9px 20px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:20px;letter-spacing:.1em;
    background:rgba(34,197,94,.07);z-index:3;}
  .stamp.miss{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.07);}
  .stamp.range{border-color:#8A94A6;color:#AAB2C0;background:rgba(138,148,166,.07);}
  .stamp.amber{border-color:var(--gold);color:var(--gold);background:rgba(234,179,8,.07);}
  .stamp.gold{border-color:var(--gold);color:var(--gold);background:rgba(234,179,8,.09);}

  /* ── "THE CALL" SEAM CARD — pre-match + post-match verdict ──────────────
     Claude Design "The Call · Seam". Flags meet on a hard oxblood seam, giant
     country codes as the hero. ONE card system, two uses:
       • pre-match  → .codes show CODE v CODE, a call band + probability split
       • verdict    → .codes show CODE <score> CODE, a verdict band + ledger
     --vc is the accent (oxblood pre-match; green/steel/gold/red per verdict
     state). Every selector is scoped under .seamcard so the shared class names
     (.bg .veil .code .band .foot .score …) never leak into the ledger/receipt
     cards above. Containers: #prematch(-ig) and #verdict(-ig). */
  .seamcard{
    --surface:#0B0B0D; --cream:#F7F4EE; --vc:var(--ox); --steel:#8A94A6;
    --t1:rgba(255,255,255,.92); --t2:rgba(255,255,255,.60);
    --t3:rgba(255,255,255,.38); --t4:rgba(255,255,255,.22);
    --b2:rgba(255,255,255,.10);
    position:relative;overflow:hidden;background:var(--surface);color:var(--t1);display:block;padding:0;}
  .seamcard.l{width:1600px;height:900px;}
  .seamcard.p{width:1080px;height:1350px;}
  .seamcard .wm{display:inline-flex;align-items:center;gap:13px;
    font-weight:800;letter-spacing:-.01em;line-height:1;font-size:30px;color:var(--t1);}
  .seamcard .wm .o{color:var(--ox);}
  .seamcard .bg{position:absolute;inset:0;z-index:0;}
  .seamcard .bg .h,.seamcard .bg .a{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(1.05);}
  .seamcard.l .bg .h{clip-path:polygon(0 0,60% 0,40% 100%,0 100%);}
  .seamcard.l .bg .a{clip-path:polygon(60% 0,100% 0,100% 100%,40% 100%);}
  .seamcard .seam{position:absolute;inset:0;width:100%;height:100%;z-index:1;}
  .seamcard .veil{position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(11,11,13,.30) 0%,rgba(11,11,13,.48) 44%,rgba(11,11,13,.95) 100%);}
  .seamcard .inner{position:relative;z-index:2;height:100%;padding:54px 70px;display:flex;flex-direction:column;}
  .seamcard .top{display:flex;justify-content:space-between;align-items:center;}
  .seamcard .kick{font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:.18em;color:var(--t2);text-transform:uppercase;}
  .seamcard .codes{margin-top:auto;display:flex;align-items:flex-end;gap:30px;line-height:.8;}
  .seamcard .code{font-weight:900;font-size:150px;letter-spacing:-.03em;text-shadow:0 6px 36px rgba(0,0,0,.6);white-space:nowrap;}
  .seamcard .vs{font-weight:700;font-size:52px;color:var(--t3);padding-bottom:24px;}
  .seamcard .score{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:116px;letter-spacing:-.03em;color:#fff;padding-bottom:8px;text-shadow:0 6px 30px rgba(0,0,0,.55);white-space:nowrap;}
  /* knockout decider — "Belgium win 4–2 on penalties" under the hero score */
  .seamcard .decider{margin-top:16px;display:inline-flex;align-items:center;gap:12px;
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:26px;letter-spacing:.02em;color:var(--cream);
    text-shadow:0 3px 18px rgba(0,0,0,.6);}
  .seamcard .decider .ddot{color:var(--gold);font-size:16px;text-shadow:0 0 10px var(--gold);}
  .seamcard .sline{margin-top:18px;display:inline-flex;align-items:center;gap:11px;
    font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.04em;color:var(--t2);}
  .seamcard .decider + .sline{margin-top:12px;}
  .seamcard .sline .k{font-size:14px;letter-spacing:.18em;color:var(--t3);text-transform:uppercase;}
  .seamcard .sline b{color:var(--cream);font-weight:600;}
  .seamcard .matchup{font-weight:600;font-size:28px;color:var(--t2);margin-top:14px;}
  .seamcard .band{margin-top:24px;display:flex;align-items:center;gap:34px;
    background:rgba(11,11,13,.62);backdrop-filter:blur(9px);border:1px solid var(--b2);
    border-left:6px solid var(--vc);border-radius:16px;padding:24px 32px;}
  .seamcard .bL{min-width:0;}
  .seamcard .bR{margin-left:auto;flex-shrink:0;}
  .seamcard .blab{font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:.2em;
    color:var(--t3);display:flex;align-items:center;gap:11px;text-transform:uppercase;}
  .seamcard .brow{display:flex;align-items:baseline;gap:18px;margin-top:10px;}
  .seamcard .pickn{font-weight:800;font-size:52px;color:var(--ox);letter-spacing:-.015em;}
  .seamcard .pct{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:46px;color:var(--t1);}
  .seamcard .conf{margin-top:11px;display:inline-flex;align-items:center;gap:9px;
    font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;}
  .seamcard .conf .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 9px var(--gold);}
  .seamcard .barwrap{flex:0 0 600px;width:600px;}
  .seamcard .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.08);}
  .seamcard .bar i{height:100%;}
  .seamcard .bar .pick{background:var(--ox);}
  .seamcard .bar .oth{background:rgba(255,255,255,.24);}
  .seamcard .bar .oth2{background:rgba(255,255,255,.15);}
  .seamcard .bar i+i{border-left:2px solid var(--surface);}
  .seamcard .barlab{display:flex;justify-content:space-between;margin-top:11px;
    font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--t2);}
  .seamcard .barlab b{color:var(--t1);font-weight:600;}
  /* verdict band — post-match */
  .seamcard .vchip{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:50%;background:var(--vc);color:#0B0B0D;font-weight:900;font-size:15px;}
  .seamcard .verdict{font-weight:900;font-size:60px;color:var(--vc);letter-spacing:-.015em;line-height:.95;margin-top:6px;}
  .seamcard .vsub{font-size:23px;color:var(--t2);margin-top:11px;max-width:560px;}
  .seamcard .vsub b{color:var(--t1);font-weight:600;}
  .seamcard .ledger{display:flex;align-items:stretch;}
  .seamcard .lc{padding:0 30px;display:flex;flex-direction:column;justify-content:center;}
  .seamcard .lc+.lc{border-left:1px solid var(--b2);}
  .seamcard .lc .lk{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.16em;color:var(--t3);text-transform:uppercase;}
  .seamcard .lc .lv{font-family:'IBM Plex Mono',monospace;font-size:44px;font-weight:700;color:var(--t1);margin-top:8px;letter-spacing:-.01em;line-height:1;white-space:nowrap;}
  .seamcard .lc.final .lv{color:var(--vc);}
  .seamcard .lc.brier .lv{font-size:30px;font-weight:600;color:var(--t2);}
  .seamcard .foot{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:24px;}
  .seamcard .foot .note{font-size:18px;color:var(--t3);line-height:1.4;}
  .seamcard .foot .url{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--t2);white-space:nowrap;}
  /* portrait (IG 4:5) */
  .seamcard.p .inner{padding:56px 58px;}
  .seamcard.p .bg .h{clip-path:polygon(0 0,58% 0,42% 100%,0 100%);}
  .seamcard.p .bg .a{clip-path:polygon(58% 0,100% 0,100% 100%,42% 100%);}
  .seamcard.p .veil{background:linear-gradient(180deg,rgba(11,11,13,.34) 0%,rgba(11,11,13,.26) 30%,rgba(11,11,13,.60) 62%,rgba(11,11,13,.97) 100%);}
  .seamcard.p .code{font-size:132px;}
  .seamcard.p .score{font-size:104px;}
  .seamcard.p .codes{gap:24px;}
  .seamcard.p .band{flex-direction:column;align-items:stretch;gap:22px;}
  .seamcard.p .barwrap{flex:none;width:100%;}
  .seamcard.p .bR{margin-left:0;}
  .seamcard.p .ledger{justify-content:space-between;}
  .seamcard.p .lc:first-child{padding-left:0;}
  .seamcard.p .vsub{max-width:none;}
</style>
</head>
<body>

<div class="card" id="ledger"></div>
<div class="card" id="ledger-ig"></div>
<div class="card" id="receipt-stage"><div class="paper bleedwrap" id="paper"></div></div>
<div class="seamcard l" id="prematch"></div>
<div class="seamcard p" id="prematch-ig"></div>
<div class="seamcard l" id="verdict"></div>
<div class="seamcard p" id="verdict-ig"></div>

<script>
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // Graded ticks: ✓ called · ≈ inside our range · ± against the read · ✗ genuine miss.
  // Accepts the new 3-state `res` and falls back to the old boolean `hit`.
  const RES = r => r.res || (r.hit ? 'hit' : 'miss');
  const GLYPH = { hit: '✓', range: '≈', amber: '±', miss: '✗' };
  const bleed = (hIso, aIso, op) => (hIso && aIso) ? `
    <div class="bleed" style="opacity:${op}">
      <div class="fl" style="background-image:url(https://flagcdn.com/w640/${hIso}.png)"></div>
      <div class="fr" style="background-image:url(https://flagcdn.com/w640/${aIso}.png)"></div>
      <div class="veil"></div>
    </div>` : '';

  // data.results: [{abbr, hg, ag, hit, line, brier, hIso, aIso}]
  // data.headline {a, b}, kicker, note, ours (brier float)
  // Seam-family row helpers (shared by the X + IG ledger). Verdict-state
  // accent + a crisp flag-SEAM tile (hero seam, miniaturised) + verdict chip
  // + code·score·code — no blurred bleed.
  const RC = { hit: '#22C55E', range: '#8A94A6', amber: '#EAB308', miss: '#EF4444' };
  const fpair = (h, a) => (h && a)
    ? `<div class="fpair"><div class="fc h" style="background-image:url(https://flagcdn.com/w320/${h}.png)"></div><div class="fc a" style="background-image:url(https://flagcdn.com/w320/${a}.png)"></div><svg class="ln" viewBox="0 0 100 60" preserveAspectRatio="none"><line x1="60" y1="0" x2="40" y2="60" stroke="#C0392B" stroke-width="2.5" style="filter:drop-shadow(0 0 5px #C0392B)"/></svg></div>`
    : `<div class="fpair"></div>`;
  const lrows = (results) => results.map(r => {
    const st = RES(r), p = String(r.abbr).split(' ');
    return `<div class="lrow" style="--rc:${RC[st] || '#A8344A'}">${fpair(r.hIso, r.aIso)}<div class="tick ${st}">${GLYPH[st]}</div><div class="mid"><div class="lscore"><span class="c">${esc(p[0] || '')}</span><span class="s">${esc(p[1] || '')}</span><span class="c">${esc(p[2] || '')}</span></div><div class="call">${r.line}</div></div><div class="brier">Brier<b>${esc(r.brier)}</b></div></div>`;
  }).join('');

  // data.results: [{abbr, res|hit, line, brier, hIso, aIso}]
  // data.headline {a, b}, kicker, note, ours (brier float)
  window.renderLedger = (d) => {
    const pos = Math.max(2, Math.min(98, (d.ours / 0.25) * 100));
    document.getElementById('ledger').innerHTML = `
      <div class="top">
        <div>
          <svg width="44" height="44" viewBox="0 0 100 100" style="vertical-align:middle;margin-right:14px">
            <path d="M 57.25 22.95 A 28 28 0 1 0 77.05 42.75" fill="none" stroke="#F7F4EE" stroke-width="9" stroke-linecap="round"/>
            <circle cx="69.8" cy="30.2" r="8" fill="#A8344A"/>
          </svg><span class="wordmark"><b>Odd</b>yessa</span>
        </div>
        <div class="kicker">${esc(d.kicker)}</div>
      </div>
      <h1>${esc(d.headline.a)}<br><span class="ox">${esc(d.headline.b)}</span></h1>
      <div class="ledgerrows">${lrows(d.results)}</div>
      <div class="track-wrap">
        <div class="track-labels"><span>PERFECT 0.000</span><span>COIN FLIP 0.222</span></div>
        <div class="track">
          <div class="marker" style="left:${pos}%"><div class="dot"></div><div class="tag">OURS <span>${d.ours.toFixed(3)}</span></div></div>
        </div>
      </div>
      <div class="foot">
        <div class="note">${esc(d.note)}</div>
        <div class="url">every call locked before kickoff · oddyessa.com</div>
      </div>`;
  };

  // r: {title, ft, kicker, meta, items:[{lab,val,res:'hit'|'range'|'amber'|'miss'|null,sub}], brier, stampText, stampTone, stampMiss, hIso, aIso}
  window.renderReceipt = (r) => {
    const items = r.items.map(it => it.sub
      ? `<div class="item"><span class="sub">↳ ${esc(it.sub)}</span></div>`
      : `<div class="item"><span class="lab">${esc(it.lab)}</span><span class="dots"></span><span class="val">${esc(it.val)}</span>${it.res ? `<span class="res ${it.res}">${GLYPH[it.res] || ''}</span>` : ''}</div>`
    ).join('');
    const [lead, digits] = r.brier.split('.');
    const stampTone = r.stampTone || (r.stampMiss ? 'miss' : '');
    document.getElementById('paper').innerHTML = `
      ${bleed(r.hIso, r.aIso, '.45')}
      <div class="stamp ${stampTone}">${esc(r.stampText)}</div>
      <div class="r-head">
        <svg width="56" height="56" viewBox="0 0 100 100" style="display:block;margin:0 auto">
          <path d="M 57.25 22.95 A 28 28 0 1 0 77.05 42.75" fill="none" stroke="#F7F4EE" stroke-width="9" stroke-linecap="round"/>
          <circle cx="69.8" cy="30.2" r="8" fill="#A8344A"/>
        </svg>
        <div class="wordmark" style="margin-top:12px"><b>Odd</b>yessa</div>
        <div class="r-kicker">${esc(r.kicker)}</div>
        <div class="r-match">${r.title}</div>
        <div class="r-ft">${esc(r.ft)}</div>
        <div class="r-meta">${esc(r.meta)}</div>
      </div>
      <div class="r-items">${items}</div>
      <div class="r-total">
        <div class="lab">MATCH BRIER<small>0 = perfect · 0.25 = coin flip</small></div>
        <div class="brier-num"><span class="lead">${lead}.</span><span class="digits">${digits}</span></div>
      </div>
      <div class="r-foot">
        <div><div class="url">oddyessa.com</div><div class="tag">read the game.</div></div>
        <div class="barcode"></div>
      </div>`;
  };


  window.renderLedgerIG = (d) => {
    const pos = Math.max(2, Math.min(98, (d.ours / 0.25) * 100));
    document.getElementById('ledger-ig').innerHTML = `
      <div class="top">
        <div>
          <svg width="46" height="46" viewBox="0 0 100 100" style="vertical-align:middle;margin-right:13px">
            <path d="M 57.25 22.95 A 28 28 0 1 0 77.05 42.75" fill="none" stroke="#F7F4EE" stroke-width="9" stroke-linecap="round"/>
            <circle cx="69.8" cy="30.2" r="8" fill="#A8344A"/>
          </svg><span class="wordmark"><b>Odd</b>yessa</span>
        </div>
        <div class="kicker">${esc(d.kickerShort || 'THE MORNING LEDGER')}</div>
      </div>
      <div style="margin:auto 0">
        <h1 style="margin-top:0">${esc(d.headline.a)}<br><span class="ox">${esc(d.headline.b)}</span></h1>
        <div class="igrows">${lrows(d.results)}</div>
        <div class="track-wrap" style="margin-top:48px">
          <div class="track-labels"><span>PERFECT 0.000</span><span>COIN FLIP 0.222</span></div>
          <div class="track">
            <div class="marker" style="left:${pos}%"><div class="dot"></div><div class="tag">OURS <span>${d.ours.toFixed(3)}</span></div></div>
          </div>
        </div>
      </div>
      <div class="foot" style="margin-top:0">
        <div class="note">${esc(d.note)}</div>
        <div class="url">every call locked before kickoff · oddyessa.com</div>
      </div>`;
  };

  // PRE-MATCH "THE CALL" — Seam design (Claude Design "The Call · Seam").
  // Same data contract as before so generate.mjs is unchanged:
  //   d: {kicker, home, away, ko, pick, pickPct, risk:'HIGH'|'MEDIUM'|'LOW',
  //       probs:{home,draw,away}, homeAbbr, awayAbbr, scoreline, scorelinePct,
  //       hIso, aIso}  (reasons[] is still used by the captions, not the card.)
  const PM_CONF = { HIGH: 'Lean', MEDIUM: 'Edge', LOW: 'Strong' };   // model conviction label
  const pmLogo = `<span class="wm"><svg width="32" height="32" viewBox="0 0 100 100"><path d="M 57 23 A 28 28 0 1 0 77 43" fill="none" stroke="#F7F4EE" stroke-width="10" stroke-linecap="round"/><circle cx="70" cy="30" r="8.5" fill="#A8344A"/></svg><span><span class="o">Odd</span>yessa</span></span>`;
  const pmSeam = (fmt) => fmt === 'p'
    ? `<svg class="seam" viewBox="0 0 1080 1350" preserveAspectRatio="none"><line x1="626" y1="0" x2="454" y2="1350" stroke="#C0392B" stroke-width="5" style="filter:drop-shadow(0 0 16px #C0392B)"/></svg>`
    : `<svg class="seam" viewBox="0 0 1600 900" preserveAspectRatio="none"><line x1="960" y1="0" x2="640" y2="900" stroke="#C0392B" stroke-width="6" style="filter:drop-shadow(0 0 20px #C0392B)"/></svg>`;
  // flags meet on the seam — full-bleed (FLAG = high-res), not the blurred bleed
  const PMFLAG = (c) => c ? `https://flagcdn.com/w1280/${c}.png` : '';
  const pmCard = (d, fmt) => {
    const pickKey = d.pick === 'Draw' ? 'draw' : (d.pick === d.home ? 'home' : 'away');
    const pickName = d.pick === 'Draw' ? 'Draw' : d.pick;
    const winProb = Math.round(d.pickPct);
    const P = { home: Math.round(d.probs.home), draw: Math.round(d.probs.draw), away: Math.round(d.probs.away) };
    const conf = PM_CONF[d.risk] || 'Lean';
    const predScore = d.scoreline ? String(d.scoreline).replace(/-/, '–') : null;   // hyphen → en-dash
    const seg = (k) => `<i class="${k === pickKey ? 'pick' : (k === 'draw' ? 'oth' : 'oth2')}" style="width:${Math.max(2, P[k])}%"></i>`;
    const bar = `<div class="bar">${seg('home')}${seg('draw')}${seg('away')}</div>
        <div class="barlab"><span><b>${esc(d.homeAbbr)}</b> ${P.home}%</span><span>DRAW ${P.draw}%</span><span><b>${esc(d.awayAbbr)}</b> ${P.away}%</span></div>`;
    const sline = predScore
      ? `<div class="sline"><span class="k">Our scoreline</span><b>${esc(predScore)}</b><span style="color:var(--t4)">·</span>${d.scorelinePct ? `${Math.round(d.scorelinePct)}% chance, ` : ''}most likely result</div>`
      : '';
    return `
      <div class="bg"><div class="h" style="background-image:url(${PMFLAG(d.hIso)})"></div><div class="a" style="background-image:url(${PMFLAG(d.aIso)})"></div></div>
      ${pmSeam(fmt)}
      <div class="veil"></div>
      <div class="inner">
        <div class="top">${pmLogo}<span class="kick">${esc(d.kicker)}</span></div>
        <div class="codes"><span class="code">${esc(d.homeAbbr)}</span><span class="vs">v</span><span class="code">${esc(d.awayAbbr)}</span></div>
        ${sline}
        <div class="matchup">${esc(d.home)} v ${esc(d.away)} · ${esc(d.ko)}</div>
        <div class="band">
          <div class="bL">
            <div class="blab">Our call</div>
            <div class="brow"><span class="pickn">${esc(pickName)}</span><span class="pct">${winProb}%</span></div>
            <div class="conf"><span class="dot"></span>${esc(conf)} · win probability</div>
          </div>
          <div class="bR barwrap">${bar}</div>
        </div>
        <div class="foot">
          <span class="note">${esc(d.footNote || 'Locked before kickoff — every call graded in public, win or lose.')}</span>
          <span class="url">oddyessa.com</span>
        </div>
      </div>`;
  };
  window.renderPrematch = (d) => { document.getElementById('prematch').innerHTML = pmCard(d, 'l'); };
  window.renderPrematchIG = (d) => { document.getElementById('prematch-ig').innerHTML = pmCard(d, 'p'); };

  // POST-MATCH "THE VERDICT" — same Seam card, graded state. Drives every
  // accent + glyph + headline + honest note straight off backend/engine/grading
  // (gradeRow), so the card can never contradict the ledger. The 4 grading
  // states map to the verdict accent --vc:
  //   hit → green "Called it" · range → steel "Inside our range"
  //   amber → gold "Against the read" · miss → red "Missed"
  //   d: {kicker, home, away, codeH, codeA, meta, ft, predScore, brier,
  //       glyph, verdict, note, vc, hIso, aIso}
  const vCard = (d, fmt) => `
      <div class="bg"><div class="h" style="background-image:url(${PMFLAG(d.hIso)})"></div><div class="a" style="background-image:url(${PMFLAG(d.aIso)})"></div></div>
      ${pmSeam(fmt)}
      <div class="veil"></div>
      <div class="inner">
        <div class="top">${pmLogo}<span class="kick">${esc(d.kicker)}</span></div>
        <div class="codes"><span class="code">${esc(d.codeH)}</span><span class="score">${esc(d.ft)}</span><span class="code">${esc(d.codeA)}</span></div>
        ${d.decider ? `<div class="decider"><span class="ddot">●</span>${esc(d.decider)}</div>` : ''}
        ${d.predScore ? `<div class="sline"><span class="k">We called</span><b>${esc(d.predScore)}</b><span style="color:var(--t4)">·</span>${d.decider ? '90-minute result above' : 'actual result above'}</div>` : ''}
        <div class="matchup">${esc(d.home)} v ${esc(d.away)}${d.meta ? ' · ' + esc(d.meta) : ''}</div>
        <div class="band">
          <div class="bL">
            <div class="blab"><span class="vchip">${d.glyph}</span>${d.decider ? 'After 90' : 'Full time'} · ${esc(d.codeH)} ${esc(String(d.ft).replace('–', ' – '))} ${esc(d.codeA)}</div>
            <div class="verdict">${esc(d.verdict)}</div>
            <div class="vsub">${esc(d.note)}</div>
          </div>
          <div class="bR">
            <div class="ledger">
              <div class="lc"><div class="lk">Predicted</div><div class="lv">${esc(d.predScore || '—')}</div></div>
              <div class="lc final"><div class="lk">${d.decider ? 'After 90' : 'Full time'}</div><div class="lv">${esc(d.ft)}</div></div>
              ${d.pens ? `<div class="lc"><div class="lk">Pens</div><div class="lv">${esc(d.pens)}</div></div>` : ''}
              <div class="lc brier"><div class="lk">Brier</div><div class="lv">${esc(d.brier)}</div></div>
            </div>
          </div>
        </div>
        <div class="foot">
          <span class="note">${esc(d.footNote || 'Filed before kickoff · graded in public.')}</span>
          <span class="url">oddyessa.com</span>
        </div>
      </div>`;
  const renderV = (id, d, fmt) => { const el = document.getElementById(id); el.style.setProperty('--vc', d.vc || 'var(--ox)'); el.innerHTML = vCard(d, fmt); };
  window.renderVerdict = (d) => renderV('verdict', d, 'l');
  window.renderVerdictIG = (d) => renderV('verdict-ig', d, 'p');

  window.imagesReady = async () => {
    const urls = [...document.querySelectorAll('[style*="background-image"]')]
      .map(el => (el.style.backgroundImage.match(/url\("?(.*?)"?\)/) || [])[1]).filter(Boolean);
    await Promise.all([...new Set(urls)].map(u => new Promise(res => {
      const i = new Image(); i.onload = i.onerror = res; i.src = u;
    })));
    await document.fonts.ready;
  };
</script>
</body>
</html>
